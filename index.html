<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Bollette Automatizzata</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 15px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555; }
        input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input:focus, select:focus, textarea:focus { border-color: #3498db; outline: none; }
        input[readonly] { background-color: #e9ecef; color: #495057; cursor: not-allowed; border: 1px solid #ced4da; }
        
        .btn-elabora { background-color: #0066cc; color: white; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 13px; }
        .btn-elabora:hover { background-color: #0052a3; }
        
        button[type="submit"] { grid-column: 1 / -1; background-color: #2ecc71; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button[type="submit"]:hover { background-color: #27ae60; }
        
        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrazione Dati e Fornitori</h2>
    <form id="dataForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="stato">Stato</label>
                <select id="stato" required>
                    <option value="Da Pagare">Da Pagare</option>
                    <option value="Pagato">Pagato</option>
                    <option value="In Lavorazione">In Lavorazione</option>
                </select>
            </div>
            <div class="form-group">
                <label for="codice_bolletta">Codice Bolletta</label>
                <input type="text" id="codice_bolletta" required placeholder="Usa la tastiera-scanner...">
            </div>
            
            <!-- SCHEDARIO DIVENTA BLOCCATO -->
            <div class="form-group">
                <label for="schedario">Schedario (Automatico)</label>
                <input type="text" id="schedario" readonly placeholder="Calcolato da Posizione">
            </div>
            
            <!-- POSIZIONE TORNA EDITABILE -->
            <div class="form-group">
                <label for="posizione">Posizione</label>
                <input type="text" id="posizione" placeholder="Inserisci la posizione...">
            </div>
            
            <div class="form-group">
                <label for="codice_B">Codice B</label>
                <input type="text" id="codice_B">
            </div>
            
            <div class="form-group">
                <label for="codice_P" style="color: #0066cc;">Codice P (Spara il PagoPa qui)</label>
                <input type="text" id="codice_P" placeholder="Usa la tastiera-scanner...">
                <button type="button" class="btn-elabora" onclick="eseguiDecodificaPagoPa()">⚡ ELABORA DATI PAGOPA</button>
            </div>
            
            <div class="form-group">
                <label for="prezzo">Prezzo (€)</label>
                <input type="number" step="0.01" id="prezzo" required value="0.00">
            </div>
            <div class="form-group">
                <label for="commissioni">Commissioni (€)</label>
                <input type="number" step="0.01" id="commissioni" value="0.00">
            </div>
            <div class="form-group">
                <label for="ingresso">Data Ingresso</label>
                <input type="date" id="ingresso">
            </div>
            <div class="form-group">
                <label for="scadenza">Data Scadenza</label>
                <input type="date" id="scadenza" required>
            </div>
            <div class="form-group">
                <label for="pagamento">Data Pagamento</label>
                <input type="date" id="pagamento">
            </div>
            <div class="form-group">
                <label for="tipo_pagamento">Tipo Pagamento</label>
                <input type="text" id="tipo_pagamento">
            </div>
            <div class="form-group">
                <label for="fornitori">Fornitore</label>
                <input type="text" id="fornitori" required>
            </div>
            <div class="form-group">
                <label for="ente_creditore">Ente Creditore</label>
                <input type="text" id="ente_creditore">
            </div>
            <div class="form-group">
                <label for="tipo">Tipo Spesa</label>
                <input type="text" id="tipo" placeholder="Es. LUCE, GAS">
            </div>
            <div class="form-group">
                <label for="anno">Anno</label>
                <input type="number" id="anno" min="2020" max="2100">
            </div>
            <div class="form-group">
                <label for="fattura">Fattura N.</label>
                <input type="text" id="fattura">
            </div>
            <div class="form-group">
                <label for="valore">Valore Totale (€)</label>
                <input type="text" id="valore" readonly value="0.00">
            </div>
            <div class="form-group full-width">
                <label for="note">Note</label>
                <textarea id="note" rows="3"></textarea>
            </div>
            <button type="submit" id="submitBtn">Invia Dati a Google Sheets</button>
        </div>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxykM-qYLvEMtwO7f9f0TAMuIIt0HY89WSIuTjVB4KUF0NyTyKVLG3002qyq7pdMEExTA/exec";

    document.getElementById('anno').value = new Date().getFullYear();

    const databaseFornitori = {
        "05050950657": { fornitore: "POLIS ENERGIA", tipo: "GAS" },
        "06377691000": { fornitore: "ENEL ENERGIA", tipo: "LUCE" },
        "01537630174": { fornitore: "A2A ENERGIA", tipo: "GAS" },
        "00164870233": { fornitore: "AGSM", tipo: "LUCE" }
    };

    // 1. LOGICA AUTOMATICA DA POSIZIONE A SCHEDARIO
    document.getElementById('posizione').addEventListener('input', function(e) {
        const testoPosizione = e.target.value.trim();
        const numeriTrovati = testoPosizione.match(/\d/g);
        if (numeriTrovati && numeriTrovati.length >= 2) {
            document.getElementById('schedario').value = numeriTrovati[0] + numeriTrovati[1];
        } else {
            document.getElementById('schedario').value = "";
        }
    });

    // 2. FUNZIONE DI DECODIFICA PAGOPA FLUIDA ED EVOLUTA
    function eseguiDecodificaPagoPa() {
        const inputP = document.getElementById('codice_P');
        const testoLetto = inputP.value.trim();
        if (!testoLetto) {
            alert("Il campo Codice P è vuoto! Spara prima il codice.");
            return;
        }

        // Se contiene le barre verticali, è un PagoPa completo
        if (testoLetto.includes('|')) {
            const segmenti = testoLetto.split('|');
            if (segmenti.length >= 4) {
                const cfEnte = segmenti[3].trim();
                document.getElementById('ente_creditore').value = cfEnte;
                
                let importoGrezzo = segmenti[4].trim();
                let prezzoPulito = parseFloat(importoGrezzo);
                if (!isNaN(prezzoPulito)) {
                    if (!importoGrezzo.includes('.') && !importoGrezzo.includes(',')) {
                        prezzoPulito = prezzoPulito / 100;
                    }
                    document.getElementById('prezzo').value = prezzoPulito.toFixed(2);
                }
                
                document.getElementById('tipo_pagamento').value = "PAGOPA";

                if (databaseFornitori[cfEnte]) {
                    document.getElementById('fornitori').value = databaseFornitori[cfEnte].fornitore;
                    document.getElementById('tipo').value = databaseFornitori[cfEnte].tipo;
                } else {
                    document.getElementById('fornitori').value = "POLIS ENERGIA"; // Fornitore predefinito se non a catalogo
                    document.getElementById('tipo').value = "LUCE";
                }
                aggiornaValoreTotale();
                return;
            }
        }
        
        // SE NON CI SONO LE BARRE VERTICALI: Forza la compilazione dei dati fissi richiesti
        document.getElementById('ente_creditore').value = "05050950657";
        document.getElementById('tipo_pagamento').value = "PAGOPA";
        document.getElementById('fornitori').value = "POLIS ENERGIA";
        document.getElementById('tipo').value = "LUCE";
        document.getElementById('note').value = "Codice grezzo letto dallo scanner.";
        alert("⚠️ Codice inserito senza separatori standard. Campi predefiniti inseriti per Polis Energia!");
    }

    function aggiornaValoreTotale() {
        const prezzo = parseFloat(document.getElementById('prezzo').value) || 0;
        const commissioni = parseFloat(document.getElementById('commissioni').value) || 0;
        const totale = prezzo + commissioni;
