<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Bollette Pro</title>
    <!-- Libreria per scansione video e immagini -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 15px; color: #333; }
        .container { max-width: 750px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 13px; }
        
        /* Zona Scanner Superiori */
        .scanner-panel { background-color: #eef2f7; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 2px dashed #0066cc; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .btn-main { background-color: #0066cc; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-sec { background-color: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        /* Griglia Modulo */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
        input, select, textarea { padding: 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        
        button[type="submit"] { grid-column: 1 / -1; background-color: #2ecc71; color: white; padding: 14px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        
        /* Popup Scanner Video Live */
        #scanner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        #reader { width: 90%; max-width: 450px; background: white; padding: 10px; border-radius: 8px; }
        .close-scanner { margin-top: 15px; background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrazione Bollette</h2>
    <div class="subtitle">Pannello Cloud collegato a Google Sheets</div>

    <!-- PANNELLO ACQUISIZIONE -->
    <div class="scanner-panel">
        <p style="margin:0; font-weight:bold; color:#2c3e50;">Scegli come inserire il codice:</p>
        <!-- METODO 1: Video dal vivo (Consigliato, corregge la sfocatura da solo) -->
        <button type="button" class="btn-main" onclick="apriScannerVideo()">🎥 AVVIA SCANNER VIDEO IN DIRETTA</button>
        
        <!-- METODO 2: Foto (Se il video non parte) -->
        <label for="foto-file" class="btn-sec">📷 CARICA FOTO DA GALLERIA</label>
        <input type="file" id="foto-file" accept="image/*" style="display: none;">
    </div>

    <!-- Modulo Dati -->
    <form id="dataForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="stato">Stato</label>
                <select id="stato" required>
                    <option value="Da Pagare">Da Pagare</option>
                    <option value="Pagato">Pagato</option>
                    <option value="In Lavorazione">In Lavorazione</option>
                </select>
            </div>
            <div class="form-group">
                <label for="codice_bolletta">Codice Bolletta (IUV)</label>
                <input type="text" id="codice_bolletta" required>
            </div>
            <div class="form-group">
                <label for="schedario">Schedario</label>
                <input type="text" id="schedario">
            </div>
            <div class="form-group">
                <label for="posizione">Posizione</label>
                <input type="text" id="posizione">
            </div>
            <div class="form-group">
                <label for="codice_B">Codice B</label>
                <input type="text" id="codice_B">
            </div>
            <div class="form-group">
                <label for="codice_P">Codice P</label>
                <input type="text" id="codice_P">
            </div>
            <div class="form-group">
                <label for="prezzo">Prezzo (€)</label>
                <input type="number" step="0.01" id="prezzo" required>
            </div>
            <div class="form-group">
                <label for="commissioni">Commissioni (€)</label>
                <input type="number" step="0.01" id="commissioni" value="0.00">
            </div>
            <div class="form-group">
                <label for="ingresso">Data Ingresso</label>
                <input type="date" id="ingresso">
            </div>
            <div class="form-group">
                <label for="scadenza">Data Scadenza</label>
                <input type="date" id="scadenza" required>
            </div>
            <div class="form-group">
                <label for="pagamento">Data Pagamento</label>
                <input type="date" id="pagamento">
            </div>
            <div class="form-group">
                <label for="tipo_pagamento">Tipo Pagamento</label>
                <input type="text" id="tipo_pagamento">
            </div>
            <div class="form-group">
                <label for="fornitori">Fornitore</label>
                <!-- Lista a discesa modificabile per evitare di scrivere ogni volta -->
                <select id="fornitori" required>
                    <option value="">-- Seleziona o scrivi nelle note --</option>
                    <option value="Enel">Enel</option>
                    <option value="Eni Plenitude">Eni Plenitude</option>
                    <option value="Servizio Elettrico Nazionale">Servizio Elettrico Nazionale</option>
                    <option value="Comune (TARI/Imposte)">Comune (TARI/Imposte)</option>
                    <option value="Acquedotto">Acquedotto</option>
                    <option value="Servizio Sanitario">Servizio Sanitario</option>
                    <option value="Altro">Altro (specifica nelle note)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ente_creditore">Ente Creditore (C.F.)</label>
                <input type="text" id="ente_creditore">
            </div>
            <div class="form-group">
                <label for="tipo">Tipo Spesa</label>
                <input type="text" id="tipo" placeholder="Es. Luce, Gas, Spazzatura">
            </div>
            <div class="form-group">
                <label for="anno">Anno</label>
                <input type="number" id="anno">
            </div>
            <div class="form-group">
                <label for="fattura">Fattura N.</label>
                <input type="text" id="fattura">
            </div>
            <div class="form-group">
                <label for="valore">Valore</label>
                <input type="text" id="valore">
            </div>
            <div class="form-group full-width">
                <label for="note">Note aggiuntive</label>
                <textarea id="note" rows="2"></textarea>
            </div>
            <button type="submit" id="submitBtn">INVIA DATI A GOOGLE SHEETS</button>
        </div>
    </form>
    <div id="statusMessage"></div>
</div>

<!-- Modal Finestra Live Video -->
<div id="scanner-modal">
    <div id="reader"></div>
    <button type="button" class="close-scanner" onclick="chiudiScannerVideo()">Chiudi X</button>
</div>

<script>
    // ⚠️ METTI IL TUO URL DI GOOGLE SCRIPT QUI SOTTO
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxykM-qYLvEMtwO7f9f0TAMuIIt0HY89WSIuTjVB4KUF0NyTyKVLG3002qyq7pdMEExTA/exec";
    
    let html5QrCodeLive = null;
    const html5QrCodeFile = new Html5Qrcode("reader"); // Istanza di backup per i file
    document.getElementById('anno').value = new Date().getFullYear();

    // ==========================================
    // METODO 1: SCANNER VIDEO LIVE (CONSIGLIATO)
    // ==========================================
    function apriScannerVideo() {
        document.getElementById('scanner-modal').style.display = 'flex';
        html5QrCodeLive = new Html5Qrcode("reader");
        
        const config = { fps: 24, qrbox: { width: 250, height: 250 } };
        
        html5QrCodeLive.start(
            { facingMode: "environment" }, 
            config,
            (text) => { smistaDatiCodice(text); chiudiScannerVideo(); },
            () => { /* Continua ricerca silente */ }
        ).catch(() => {
            alert("Il browser o il sistema blocca lo streaming video. Usa il caricamento foto.");
            chiudiScannerVideo();
        });
    }

    function chiudiScannerVideo() {
        if (html5QrCodeLive) {
            html5QrCodeLive.stop().then(() => {
                document.getElementById('scanner-modal').style.display = 'none';
            }).catch(() => {
                document.getElementById('scanner-modal').style.display = 'none';
            });
        } else {
            document.getElementById('scanner-modal').style.display = 'none';
        }
    }

    // ==========================================
